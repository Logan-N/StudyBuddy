<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>Study Buddy - Generate Quiz</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>Study Buddy</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="quiz.html">Quiz</a>
        <a href="planner.html">Planner</a>
        <a class ="active" href="login.html">Account</a>
      </nav>
    </header>

    <h2 class="page-title">Register</h2>
    <div class="layout">
      <section class="card">
        <h3>Enter Your Account Details</h3>
        <form id="RegisterForm">
          <label for="email">Email</label>
          <input id="email" name="email" placeholder="example@gmail.com">

          <label for="password">Password</label>
          <input id="password" name="password" placeholder="">

          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword" placeholder="">
          <button type="submit">Register</button>
        </form>
      </section>

      <aside class="card">
        <h3>Already a User?</h3>
        <div style="margin-top: 12px; display: grid; gap: 8px;">
        <a class="button-link" href="login.html">Login</a>
          <div id="shareOutput" class="share-link"></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // Get the form element by its ID and store in the register variable
    const register = document.getElementById("RegisterForm");

    // Add an event listener to the form that listens for the submit event
    register.addEventListener("submit", async (event) => {
      // Prevent the default form submission from being sent
      event.preventDefault();
      // get the values of the email and password input fields and store them in a variable
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      // Check if the password and confirm password fields match
      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }
      try {
        // Send the RegisterForm data to the server
        const response = await fetch("/api/Register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          // Send the email and password as a JSON string in the request body
          body: JSON.stringify({ email, password }),
        });

        // Return result
        const result = await response.json();
        alert(result.message);

      }
      catch (error) {
        // If there is an error, alert the user with the error message
        alert(`Error: ${error.message}`);
      }
    }
  );
  </script>
</body>
</html>
