<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>Study Buddy - Generate Quiz From Notes</title>
</head>

<body>

<div class="container">

    <header>

        <h1>Study Buddy</h1>
        <nav>
            <a href="home.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="planner.html">Planner</a>
            <a href="account.html">Account</a>
        </nav>

    </header>

    <h2 class="page-title">Quiz Generator</h2>

    <div class="layout">

        <section class="card">

            <h3>Create a Quiz</h3>

            <form id="quizForm">

                <label for="notesFile">
                    Notes File (PDF, DOCX, or TXT)
                </label>

                <input
                    id="notesFile"
                    name="notesFile"
                    type="file"
                    accept=".pdf,.docx,.txt"
                    required
                >
                <label for="qcount">
                    Number of Questions
                </label>

                <input
                    id="qcount"
                    name="qcount"
                    type="number"
                    min="1"
                    max="50"
                    value="5"
                >
                <label for="type">
                    Question Type
                </label>

                <select id="type" name="type">

                    <option value="multiple">
                        Multiple Choice
                    </option>

                    <option value="short">
                        Short Answer
                    </option>

                    <option value="fill">
                        Fill in the Blank
                    </option>

                    <option value="flashcard">
                        Flashcard
                    </option>

                    <option value="truefalse">
                        True / False
                    </option>

                </select>

                <label for="difficulty">
                    Difficulty
                </label>

                <select id="difficulty">

                    <option value="easy">
                        Easy
                    </option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="hard">
                        Hard
                    </option>

                </select>

                <button type="submit">
                    Generate Quiz
                </button>

                <a class="button-link" href="quiz.html">
                    Cancel
                </a>

            </form>

        </section>

        <aside class="card">

            <h3>Generate Quiz</h3>

            <p>
                Your AI-generated quiz will be saved to your account.
            </p>

        </aside>

    </div>

</div>


<script>
    //Transfer someone to index.html if they are not logged in
    const token = localStorage.getItem("jwt");

    // If there is no token, redirect to index.html
    if (!token)
    {
        window.location.href = "index.html";
    }

    // If there is a token, check if it is expired
    try {
        const payload = JSON.parse(atob(token.split(".")[1]));

        // If the token is expired, remove it from localStorage and redirect to index.html
        if (payload.exp * 1000 < Date.now())
        {
            localStorage.removeItem("jwt");
            window.location.href = "index.html";
        }
    }

        // If there is a token error, remove it from localStorage and redirect to index.html
        catch
        {
            localStorage.removeItem("jwt");
            window.location.href = "index.html";
        }
    //Loads a script for Mammoth.js or PDF.js to extract the text from a docx or pdf file
    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = src;
            script.onload = resolve;
            script.onerror = () => reject(new Error(`Failed to load ${src}`));
            document.head.appendChild(script);
        });
}

    // if the file is a pdf, extracts the text out of a pdf file using pdf.js
    async function extractPdfText(file) 
    {
        // Dynamically import pdf.js from a CDN
        const pdfjsLib = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/pdf.mjs");

        // Set the workerSrc property to the URL of the pdf.worker.js file
        pdfjsLib.GlobalWorkerOptions.workerSrc ="https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/pdf.worker.min.mjs";

        // Read the file as an ArrayBuffer and load it into pdf.js
        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

        // Initialize an empty string to hold the extracted text
        let fullText = "";

        // Loop through each page of the PDF and extract the text
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) 
        {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map((item) => item.str).join(" ");
            fullText += pageText + "\n\n";
        }
        // Return the extracted text
        return fullText;
    }

    // extracts the text out of a docx file using mammoth
    async function extractDocxText(file) 
    {
        // Load mammoth.js from a CDN if it's not already loaded
        if (!window.mammoth) 
        {
        await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.11.0/mammoth.browser.min.js");
        }

        // Read the file as an ArrayBuffer and load it into mammoth
        const buffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer: buffer });

        // Return the extracted text
        return result.value;
    }

    // based on file extension, extracts the text out of a pdf, docx, or txt file
    async function extractNotesText(file) {const extension = file.name.slice(file.name.lastIndexOf(".")).toLowerCase();
    
    //uses file.text() to extract the text from a txt file
    if (extension === ".txt") 
    {
        return await file.text();
    }

    //uses pdf.js to extract the text from a pdf file
    if (extension === ".pdf") {
        return await extractPdfText(file);
    }

    //uses mammoth.js to extract the text from a docx file
    if (extension === ".docx") {
        return await extractDocxText(file);
    }

    // If the file type is not supported, throw an error
    throw new Error("Only PDF, DOCX, and TXT files are supported.");
    }

    // Handle form submission
    const quizForm = document.getElementById("quizForm");

    // Add an event listener for the form submission
    quizForm.addEventListener(
        "submit",
        async (event) => {
        event.preventDefault();

        //Disable submit button when generating quiz to prevent multiple submissions
        const submitBtn = quizForm.querySelector("button[type='submit']");
        const originalBtnText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Reading file...";

        const file = document.getElementById("notesFile").files[0];
        const count = Number(document.getElementById("qcount").value);
        const type = document.getElementById("type").value;
        const difficulty = document.getElementById("difficulty").value;

        try {
            // pull the plain text out of the file right here in the browser,
            // so the backend never has to deal with pdf/docx parsing at all
            const notesText = await extractNotesText(file);

            if (!notesText || notesText.trim().length === 0) 
            {
                throw new Error("Couldn't find any readable text in that file.");
            }

            submitBtn.textContent = "Generating...";

            // Make a POST request to the server to generate the quiz
            const response = await fetch("/api/generateQuizFromNotes",
            {
                method: "POST",
                headers:
            {
                "Content-Type": "application/json",
                "X-Auth-Token": token
            },
                body: JSON.stringify({ notesText, count, type, difficulty })
            }
    );

    // Read the response as text first incase it's not valid JSON (e.g., an error message)
    const rawText = await response.text();

    let result;
    try {
        result = rawText ? JSON.parse(rawText) : {};
    } catch (parseError) {
        throw new Error(`Server returned an unexpected response (status ${response.status}).`);
    }

    // If the response is not OK, throw an error with the message from the server
    if (!response.ok)
    {
        throw new Error(result.error || `Request failed with status ${response.status}`);
    }

    // If the quiz is generated successfully, show an alert and redirect to the quiz page
    alert("Quiz generated successfully!");
    // Redirect to the quiz page
    window.location.href ="quiz.html";
    }

    // If an error occurs during the request, log it and show an alert to the user
    catch(error) {
        console.error(error);
        alert("Failed to generate quiz: " + error.message);
    }

    // Always re-enable the button, whether the request succeeded,
    // failed, or we're about to navigate away.
    finally 
    {
        submitBtn.disabled = false;
        submitBtn.textContent = originalBtnText;
    }
    }
);
</script>

</body>
</html>
