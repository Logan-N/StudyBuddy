<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>Study Buddy - Quiz</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>Study Buddy</h1>
      <nav>
        <a href="home.html">Home</a>
        <a class ="active" href="quiz.html">Quiz</a>
        <a href="planner.html">Planner</a>
		    <a href="account.html">Account</a>
      </nav>
    </header>

    <h2 class="page-title">Quiz Dashboard</h2>
    <div class="layout">
      <section class="card">
        <h3>My Quizzes</h3>
		<div class="small preview">No quiz generated yet.</div>
      </section>

      <aside class="card">
        <h3>Quiz Options</h3>
        <div style="margin-top: 12px; display: grid; gap: 8px;">
		  <button id="OpenQuiz" class="secondary">Open Selected Quiz</button>
		  <button id="DeleteQuiz" class="secondary">Delete Selected Quiz</button>
        </div>
      <aside class="card">
        <h3>New Quiz</h3>
        <div style="margin-top: 12px; display: grid; gap: 8px;">
        <a class="button-link" href="generatequiz.html">Generate New Quiz</a>
        </div>
      </aside>
    </div>
  </div>
  <script>
    //Transfer someone to index.html if they are not logged in
    const token = localStorage.getItem("jwt");
    // If there is no token, redirect to index.html
    if (!token) 
    {
    window.location.href = "index.html";
    }
    // If there is a token, check if it is expired
    try {
      const payload = JSON.parse(atob(token.split(".")[1]));
        // If the token is expired, remove it from localStorage and redirect to index.html
        if (payload.exp * 1000 < Date.now()) 
        {
          localStorage.removeItem("jwt");
          window.location.href = "index.html";
        }

      }
      // If there is a token error, remove it from localStorage and redirect to index.html
      catch 
      {
        localStorage.removeItem("jwt");
        window.location.href = "index.html";
      }
      
  </script>

</body>
</html>
