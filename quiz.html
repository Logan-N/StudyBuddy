<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css">
    <title>Study Buddy - Quiz</title>
</head>


<body>

<div class="container">
    <header>

        <h1>Study Buddy</h1>
        <nav>

            <a href="home.html">Home</a>
            <a class="active" href="quiz.html">
                Quiz
            </a>
            <a href="planner.html">
                Planner
            </a>
            <a href="account.html">
                Account
            </a>

        </nav>

    </header>

    <h2 class="page-title">
        Quiz Dashboard
    </h2>

    <div class="layout">

        <section class="card">

            <h3>
                My Quizzes
            </h3>

            <div id="quizList" class="small preview">
                Loading quizzes...
            </div>

        </section>




        <aside class="card">

            <h3>
                Quiz Options
            </h3>

            <div style="margin-top:12px; display:grid; gap:8px;">

                <button 

                    id="openQuiz"
                    class="secondary">
                    Open Selected Quiz

                </button>

                <button
                    id="deleteQuiz"
                    class="secondary">
                    Delete Selected Quiz

                </button>

                <a 
                    class="button-link"
                    href="generatequiz.html">
                    Generate New Quiz
                </a>
                <a 
                    class="button-link"
                    href="generatequizfromnotes.html">
                    Generate New Quiz From Notes
                </a>

            </div>

        </aside>

    </div>

</div>

<script>
  //Transfer someone to index.html if they are not logged in
  const token = localStorage.getItem("jwt");
  // If there is no token, redirect to index.html
  if (!token) 
  {
    window.location.href = "index.html";
  }
    // If there is a token, check if it is expired
    try {
      const payload = JSON.parse(atob(token.split(".")[1]));
        // If the token is expired, remove it from localStorage and redirect to index.html
        if (payload.exp * 1000 < Date.now()) 
        {
          localStorage.removeItem("jwt");
          window.location.href = "index.html";
        }

      }
      // If there is a token error, remove it from localStorage and redirect to index.html
      catch 
      {
        localStorage.removeItem("jwt");
        window.location.href = "index.html";
      }

  // Get the quiz list element
  const quizList =
  document.getElementById("quizList");

  // Get the selected quiz
  let selectedQuiz = null;
  // Load quizzes from the database
  async function loadQuizzes() {

  try {

      // Call the GET request to the Quizzes Azure Function
      const response = await fetch
      (
        "/api/Quizzes",
        {
          method: "GET",
          headers: 
          {
            "X-Auth-Token": token
          }
        }
      );

      // Get the response as JSON
      const result = await response.json();
        
      // If the response is not ok, throw an error
      if (!response.ok) 
      {
        throw new Error(result.error);
      }

        // Display the quizzes in the quiz list
        displayQuizzes(result.quizzes);
    }

    // If an error occurs during the request, log it and show an alert to the user
    catch(error) {
        console.error(error);
        quizList.innerHTML = "Failed to load quizzes.";
        alert(error.message);
    }
}

// Display the quizzes in the quiz list
function displayQuizzes(quizzes) {
    quizList.innerHTML = "";

    // If there are no quizzes, show a message
    if (!quizzes || quizzes.length === 0) {
      quizList.textContent = "No quizzes created yet.";
        return;
    }

    // For each quiz, create a div element and add it to the quiz list
    quizzes.forEach((quiz) => 
    {

      const item = document.createElement("div");

      item.className = "quiz-item";

      item.style.padding = "10px";

      item.style.cursor = "pointer";
      // Set the inner HTML of the quiz item with quiz details
      item.innerHTML = `
        <strong>
            ${quiz.Title}
        </strong>

        <br>
          Topic:
          ${quiz.Topic || "None"}

        <br>
          Difficulty:
          ${quiz.Difficulty}

        <br>
          Created:
          ${new Date(quiz.CreatedDate).toLocaleDateString()}

        <br>
          Last score:
          ${quiz.Score !== null ? `${quiz.Score}% (${quiz.CorrectAnswers}/${quiz.TotalQuestions})` : "Not taken yet"}
        `;

        // Add click event listener to select the quiz
        item.addEventListener("click",() => 
        {
          document.querySelectorAll(".quiz-item").forEach(element => {
          element.style.border = "none";
          });
          item.style.border =
          "2px solid";
          selectedQuiz = quiz;
            }
        );

        // Append the quiz item to the quiz list
        quizList.appendChild(item);
    });

}

  // Add event listeners for the open and delete buttons
  document.getElementById("openQuiz").addEventListener("click",() => 
  {
    if (!selectedQuiz) 
      {
        alert("Select a quiz first.");
        return;
        }

        // Redirect to the viewquiz.html page with the selected quiz ID as a query parameter
        window.location.href = `viewquiz.html?id=${selectedQuiz.QuizID}`;
    }
);

  // Add event listener for the delete button
  document.getElementById("deleteQuiz").addEventListener("click",async () => 
  {
  if (!selectedQuiz)
    {
      alert("Select a quiz first.");
      return;
    }

  // Confirm deletion with the user
  const confirmDelete = confirm("Are you sure you want to delete this quiz?");
    if (!confirmDelete) 
    {
      return;
    }

  // Call the DELETE request to the DeleteQuiz Azure Function
  try {
    const response =
    await fetch(`/api/DeleteQuiz?id=${selectedQuiz.QuizID}`,
    {
      method: "DELETE",
      headers: 
      {
        "X-Auth-Token": token
      }
    }
    );

    // Get the response as JSON
    const result = await response.json();
    if (!response.ok) 
    {
      throw new Error(result.error);
    }

    // If the quiz is deleted successfully, show an alert and reload the quizzes
    alert("Quiz deleted successfully.");

    // Reset the selected quiz and reload the quizzes
    selectedQuiz = null;

    // Reload the quizzes
    loadQuizzes();
    }

    // If a failure occurs while deleting a quiz
    catch(error) 
    {
      console.error(error);
      alert("Failed to delete quiz: " + error.message);
    }
  }
);

// Load quizzes when the page loads
loadQuizzes();

</script>

</body>

</html>
