<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>Study Buddy - Planner</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>Study Buddy</h1>
      <nav>
        <a href="home.html">Home</a>
        <a href="quiz.html">Quiz</a>
        <a class="active" href="planner.html">Planner</a>
		    <a href="account.html">Account</a>
      </nav>
    </header>

    <h2 class="page-title">Planner</h2>
    <div class="layout">
	<section class="card">
  <h3 id="calendarTitle">Calendar</h3>
  <div id="calendarGrid" class="calendar-grid"></div>
</section>
	  
      <aside class="card">
        <h3>Add Event</h3>
        <form id="plannerForm">
          <label for="eventDate">Date</label>
          <input id="eventDate" type="date" required>

          <label for="eventStartTime">Start Time (optional)</label>
          <input id="eventStartTime" type="time">

          <label for="eventEndTime">End Time (optional)</label>
          <input id="eventEndTime" type="time">
	
          <label for="eventTitle">Title</label>
          <input id="eventTitle" placeholder="Math Test" maxlength="30" required>
		  <label for ="activityType"> Activity Type </label>
		  <select id="activityType" required>
			<option value="CLA">Classes</option>
    		<option value="DEA">Deadlines</option>
    		<option value="EXA">Exam</option>
			<option value="STD">Study goals</option>
		  </select>
          <label for="eventNotes">Notes (optional)</label>
          <textarea id="eventNotes" rows="4" placeholder="Add study goals or reminders"></textarea>
			
          <button type="submit">Add to Planner</button>
        </form>
      </aside>

      <section class="card">
        <h3>Upcoming Events</h3>
        <div class="planner-list" id="plannerList">
          <div class="small">No events yet.</div>
        </div>
        <div style="margin-top: 12px; display: grid; gap: 8px;">
          <button id="exportPlanner" class="secondary">Export Events</button>
        </div>
      </section>

	  
    </div>
  </div>

  <script>
    //Transfer someone to index.html if they are not logged in
    const token = localStorage.getItem("jwt");
    // If there is no token, redirect to index.html
    if (!token) 
    {
    window.location.href = "index.html";
    }
    // If there is a token, check if it is expired
    try {
      const payload = JSON.parse(atob(token.split(".")[1]));
        // If the token is expired, remove it from localStorage and redirect to index.html
        if (payload.exp * 1000 < Date.now()) 
        {
          localStorage.removeItem("jwt");
          window.location.href = "index.html";
        }

      }
      // If there is a token error, remove it from localStorage and redirect to index.html
      catch 
      {
        localStorage.removeItem("jwt");
        window.location.href = "index.html";
      }


    const plannerForm = document.getElementById('plannerForm');
    const plannerList = document.getElementById('plannerList');
    const exportPlanner = document.getElementById('exportPlanner');
    const calendarGrid = document.getElementById('calendarGrid');
    let events = [];

    // maps the 3-letter DB codes to something readable for display
    const activityTypeLabels = {
      CLA: 'Class',
      DEA: 'Deadline',
      EXA: 'Exam',
      STD: 'Study Goal'
    };

	// Load planner events from the database
	async function loadPlanner() {
 	 try {

   		 // Call the GET request to the Planner Azure Function
       const response = await fetch("/api/Planner", {
       method: "GET",
       headers: {
       "x-auth-token": localStorage.getItem("jwt")
  }
  });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.message);
    }

    events = result.map(event => ({
    date: event.ActivityDate.split("T")[0],
    title: event.ActivityTitle,
    notes: event.Notes,
    startTime: event.StartTime,
    endTime: event.EndTime,
    activityType: event.ActivityType
  }));

    // Display the events and calendar
    renderEvents();

  	} catch (error) 
	{
    console.error("Failed to load planner:", error);
  	}
  }
    // Add event listener for the planner form submission
    plannerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
	
      const date = document.getElementById('eventDate').value;
	    const activityType = document.getElementById('activityType').value;
      const title = document.getElementById('eventTitle').value;
      const notes = document.getElementById('eventNotes').value;
      const startTime = document.getElementById('eventStartTime').value || null;
      const endTime = document.getElementById('eventEndTime').value || null;

      try {
        const response = await fetch("/api/Planner", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-auth-token": localStorage.getItem("jwt")
          },
          body: JSON.stringify({
            date,
			      activityType,
            title,
            notes,
            startTime,
            endTime
          })
        });

        const result = await response.json();

        if (response.ok) {
          events.push({ id: Date.now(), date, activityType, title, notes, startTime, endTime });
          renderEvents();
          plannerForm.reset();
        } else {
          console.error(result);
        }
      } catch (error) {
        console.error("Failed to save planner event:", error);
      }
    });

    // converts the 24H Time into the AM PM for better reading
    function formatTime(time) {
      const [hourStr, minute] = time.split(':');
      const hour = parseInt(hourStr, 10);
      const period = hour >= 12 ? 'PM' : 'AM';
      const displayHour = hour % 12 === 0 ? 12 : hour % 12;
      return `${displayHour}:${minute} ${period}`;
    }

    //Format the Time in event list based on if No time, Start time only, or Start and End tim
    function formatTimeRange(startTime, endTime) {

      //if no start time, display nothing.
      if (!startTime) 
      {
        return '';
      }

      //if there is a start time and an end time, display both.
      if (endTime)
      {
        return `${formatTime(startTime)} - ${formatTime(endTime)}`;
      } 

      //if there is a start time but no end time, display only the start time.
      return formatTime(startTime);
    }

    // Render the events in the planner list and the calendar
    function renderEvents() {
      plannerList.innerHTML = '';
      
      if (events.length === 0) {
        plannerList.innerHTML = '<div class="small">No events yet.</div>';
        renderCalendar();
        return;
      }
      
      events.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach((ev) => {
        const div = document.createElement('div');
        div.className = 'event-card';
        div.innerHTML = `
          <div class="event-icon">📅</div>
          <div class="event-content">
            <h4>${escapeHtml(ev.title)}</h4>
            <div class="event-date">${escapeHtml(formatDate(ev.date))}${ev.startTime ? ' · ' + escapeHtml(formatTimeRange(ev.startTime, ev.endTime)) : ''} · ${escapeHtml(activityTypeLabels[ev.activityType] || ev.activityType)}${ev.notes ? ' · ' + escapeHtml(ev.notes) : ''}</div>
          </div>
        `;
        plannerList.appendChild(div);
      });

      renderCalendar();
    }

    // Render the calendar grid with the current month and events
    function renderCalendar() 
    {
      if (!calendarGrid) 
      {
        return;
      }

      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const firstDay = new Date(year, month, 1);
      const startingDay = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const calendarTitle = document.getElementById('calendarTitle');
      calendarGrid.innerHTML = '';
      // set the calendar title to show the current month + year
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      calendarTitle.textContent = `${monthNames[month]} ${year}`;

      dayNames.forEach((name) => 
      {
        const label = document.createElement('div');
        label.className = 'calendar-label';
        label.textContent = name;
        calendarGrid.appendChild(label);
      });

      for (let i = 0; i < startingDay; i++) 
      {
        const empty = document.createElement('div');
        empty.className = 'calendar-day empty';
        calendarGrid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) 
      {
        const cell = document.createElement('div');
        cell.className = 'calendar-day';

        const dateValue = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEvents = events.filter((ev) => ev.date === dateValue);

        let eventHtml = '';
        if (dayEvents.length > 0) 
        {
          eventHtml = `<div class="calendar-day-event">${escapeHtml(dayEvents[0].title)}</div>`;
          if (dayEvents.length > 1) 
          {
            eventHtml += `<div class="calendar-multiple">+${dayEvents.length - 1} more</div>`;
          }
        }

        cell.innerHTML = `<div class="calendar-day-number">${day}</div>${eventHtml}`;
        calendarGrid.appendChild(cell);
      }
    }

    // Format the date in a more readable format for display
    function formatDate(dateString) 
    {
      if (!dateString)
      { 
        return '';
      }
      const date = new Date(dateString + 'T00:00:00');
      return date.toLocaleDateString(undefined, {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    //Exports the events in the planner to a text file.
    exportPlanner.addEventListener('click', () => {
      const lines = events
        .slice()
        .sort((a, b) => a.date.localeCompare(b.date))
        .map((ev) => {
          const timeText = formatTimeRange(ev.startTime, ev.endTime);
          const parts = [formatDate(ev.date)];
          if (timeText) parts.push(timeText);
          parts.push(activityTypeLabels[ev.activityType] || ev.activityType);
          parts.push(ev.title);
          if (ev.notes && ev.notes !== 'none') parts.push(`(${ev.notes})`);
          return parts.join(' | ');
        });

      const text = lines.length > 0
        ? lines.join('\n')
        : 'No events to export.';

      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'planner-events.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
    
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    // Load events when the page is loaded
   window.addEventListener("load", async () => {
      // Load events from SQL
      await loadPlanner();
    });
  </script>
</body>
</html>
