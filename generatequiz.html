<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>Study Buddy - Generate Quiz</title>
</head>

<body>

<div class="container">

    <header>

        <h1>Study Buddy</h1>
        <nav>
            <a href="home.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="planner.html">Planner</a>
            <a href="account.html">Account</a>
        </nav>

    </header>

    <h2 class="page-title">Quiz Generator</h2>

    <div class="layout">

        <section class="card">

            <h3>Create a Quiz</h3>

            <form id="quizForm">

                <label for="title">
                    Quiz Title
                </label>

                <input
                    id="title"
                    name="title"
                    placeholder="e.g., Biology Basics"
                    required
                >
                <label for="topic">
                    Topic / Instructions
                </label>

                <input
                    id="topic"
                    name="topic"
                    placeholder="e.g., Intro to cells"
                    required
                >
                <label for="qcount">
                    Number of Questions
                </label>

                <input
                    id="qcount"
                    name="qcount"
                    type="number"
                    min="1"
                    max="50"
                    value="5"
                >
                <label for="type">
                    Question Type
                </label>

                <select id="type" name="type">

                    <option value="multiple">
                        Multiple Choice
                    </option>

                    <option value="short">
                        Short Answer
                    </option>

                    <option value="fill">
                        Fill in the Blank
                    </option>

                    <option value="flashcard">
                        Flashcard
                    </option>

                    <option value="truefalse">
                        True / False
                    </option>

                </select>

                <label for="difficulty">
                    Difficulty
                </label>

                <select id="difficulty">

                    <option value="easy">
                        Easy
                    </option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="hard">
                        Hard
                    </option>

                </select>

                <button type="submit">
                    Generate Quiz
                </button>

                <a class="button-link" href="quiz.html">
                    Cancel
                </a>

            </form>

        </section>

        <aside class="card">

            <h3>Generate Quiz</h3>

            <p>
                Your AI-generated quiz will be saved to your account.
            </p>

        </aside>

    </div>

</div>


<script>
  //Transfer someone to index.html if they are not logged in
  const token = localStorage.getItem("jwt");

  // If there is no token, redirect to index.html
  if (!token)
  {
    window.location.href = "index.html";
  }

  // If there is a token, check if it is expired
  try {
    const payload = JSON.parse(atob(token.split(".")[1]));

      // If the token is expired, remove it from localStorage and redirect to index.html
      if (payload.exp * 1000 < Date.now())
        {
          localStorage.removeItem("jwt");
          window.location.href = "index.html";
        }
      }

      // If there is a token error, remove it from localStorage and redirect to index.html
      catch
      {
        localStorage.removeItem("jwt");
        window.location.href = "index.html";
      }

// Handle form submission
const quizForm = document.getElementById("quizForm");

// Add an event listener for the form submission
quizForm.addEventListener(
  "submit",
  async (event) => {
  event.preventDefault();

  // Grab the submit button so we can disable it while the request
  // is in flight and prevent duplicate submissions.
  const submitBtn = quizForm.querySelector("button[type='submit']");
  const originalBtnText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = "Generating...";

  const title = document.getElementById("title").value;
  const topic = document.getElementById("topic").value;
  const count = Number(document.getElementById("qcount").value);
  const type = document.getElementById("type").value;
  const difficulty = document.getElementById("difficulty").value;

  try {
    // Make a POST request to the server to generate the quiz
    const response = await fetch("/api/generateQuiz",
    {
      method: "POST",
      headers:
      {
        "Content-Type": "application/json",
        "X-Auth-Token": token
      },

      // Send the quiz details in the request body as JSON
      body: JSON.stringify({
        title,
        topic,
        count,
        type,
        difficulty
      })

      }
  );

  // Read the response as raw text first, since a failing/empty
  // response body will throw on response.json() directly and
  // produce an unhelpful "Unexpected end of JSON input" error with
  // no indication of the actual status code or cause.
  const rawText = await response.text();

  let result;
  try {
    result = rawText ? JSON.parse(rawText) : {};
  } catch (parseError) {
    throw new Error(
      `Server returned an unexpected response (status ${response.status}).`
    );
  }

  // If the response is not OK, throw an error with the message from the server
  if (!response.ok)
  {
    throw new Error(result.error || `Request failed with status ${response.status}`);
  }

  // If the quiz is generated successfully, show an alert and redirect to the quiz page
  alert("Quiz generated successfully!");
  // Redirect to the quiz page
  window.location.href ="quiz.html";
  }

  // If an error occurs during the request, log it and show an alert to the user
  catch(error) {
    console.error(error);
    alert("Failed to generate quiz: " + error.message);
  }

  // Always re-enable the button, whether the request succeeded,
  // failed, or we're about to navigate away.
  finally {
    submitBtn.disabled = false;
    submitBtn.textContent = originalBtnText;
  }
    }
);
</script>

</body>
</html>
