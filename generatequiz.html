<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>Study Buddy - Generate Quiz</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>Study Buddy</h1>
      <nav>
        <a class="active" href="home.html">Home</a>
        <a href="quiz.html">Quiz</a>
        <a href="planner.html">Planner</a>
        <a href="account.html">Account</a>
      </nav>
    </header>




    <h2 class="page-title">Quiz Generator</h2>
    <div class="layout">
      <section class="card">
        <h3>Create a Quiz</h3>
        <form id="quizForm">
          <label for="title">Quiz Title</label>
          <input id="title" name="title" placeholder="e.g., Biology Basics" required>




          <label for="topic">Topic / Instructions</label>
          <input id="topic" name="topic" placeholder="e.g., Intro to cells or ask for multiple choice">




          <label for="qcount">Number of Questions</label>
          <input id="qcount" name="qcount" type="number" min="1" max="50" value="5">




          <label for="type">Question Type</label>
          <select id="type" name="type">
            <option value="multiple">Multiple Choice</option>
            <option value="short">Short Answer</option>
            <option value="fill">Fill in the Blank</option>
            <option value="flashcard">Flashcard</option>
            <option value="truefalse">True / False</option>
          </select>




          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>


          <button type="submit">Generate and Save Quiz</button>
          <a class="button-link" href="Quiz.html">Cancel</a>
        </form>
      </section>




      <aside class="card">
        <h3>Preview</h3>
        <div id="questionsContainer" class="small preview">No quiz generated yet.</div>
        <div style="margin-top: 12px; display: grid; gap: 8px;">
          <button id="downloadQuiz" class="secondary">Download JSON</button>
          <button id="shareQuiz" class="secondary">Create Share Link</button>
          <div id="shareOutput" class="share-link"></div>
        </div>
      </aside>
    </div>
  </div>




  <script>
     //Transfer someone to index.html if they are not logged in
    const token = localStorage.getItem("jwt");
    // If there is no token, redirect to index.html
    if (!token) 
    {
    window.location.href = "index.html";
    }
    // If there is a token, check if it is expired
    try {
      const payload = JSON.parse(atob(token.split(".")[1]));
        // If the token is expired, remove it from localStorage and redirect to index.html
        if (payload.exp * 1000 < Date.now()) 
        {
          localStorage.removeItem("jwt");
          window.location.href = "index.html";
        }

      }
      // If there is a token error, remove it from localStorage and redirect to index.html
      catch 
      {
        localStorage.removeItem("jwt");
        window.location.href = "index.html";
      }

    const quizForm = document.getElementById('quizForm');
    const questionsContainer = document.getElementById('questionsContainer');
    const downloadQuiz = document.getElementById('downloadQuiz');
    const shareQuiz = document.getElementById('shareQuiz');
    const shareOutput = document.getElementById('shareOutput');
    let lastQuiz = null;




    quizForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value || 'Untitled Quiz';
      const topic = document.getElementById('topic').value || '';
      const count = parseInt(document.getElementById('qcount').value, 10) || 5;
      const type = document.getElementById('type').value;
      const difficulty = document.getElementById('difficulty').value;




      const questions = [];
      for (let i = 1; i <= count; i++) {
        if (type === 'multiple') {
          questions.push({
            id: i,
            type: 'multiple',
            question: `${title} - Q${i}: ${topic || 'Sample question text'}`,
            options: ['A', 'B', 'C', 'D'],
            answer: 'A'
          });
         
        } else if (type === 'fill') {
          questions.push({
            id: i,
            type: 'fill',
            question: `${title} - Q${i}: ${topic || 'Fill in the blank statement (use ___)'}`,
            answer: 'Sample Answer'
        });
       
        } else if (type === 'flashcard') {
          questions.push({
          id: i,
          type: 'flashcard',
          question: `${title} - Q${i}: ${topic || 'Flashcard prompt'}`,
          answer: 'Flashcard Back Answer'
        });
        }   else if (type === 'truefalse') {
          questions.push({
            id: i,
            type: 'truefalse',
            question: `${title} - Q${i}: ${topic || 'Sample statement'}`,
            answer: true
          });
        } else {
          questions.push({
            id: i,
            type: 'short',
            question: `${title} - Q${i}: ${topic || 'Prompt'}`,
            answer: ''
          });
        }
      }




      lastQuiz = { title, topic, difficulty, type, questions, generatedAt: new Date().toISOString() };
      renderQuiz(lastQuiz);




      // database saving
      const quizId = 1;




      questions.forEach(function(q) {
        // loop for function
        // endpoint for url address
        let endpoint = "";
        // holds data to send
        let dataToSend = {};




        // check if McQ
        if (type === 'multiple') {
          // endpoint check
          endpoint = '/api/SaveMultipleChoice';
          // sends necessary data
          dataToSend = { quizId: quizId, questionText: q.question, options: q.options, correctAnswer: q.answer };
        } // same idea as endpoint check
        else if (type === 'fill') {
          endpoint = '/api/SaveFillInTheBlank';
          dataToSend = { quizId: quizId, questionText: q.question, correctAnswer: q.answer };
        } // same idea as endpoint check
        else if (type === 'flashcard') {
          endpoint = '/api/SaveFlashcard';
          dataToSend = { quizId: quizId, questionText: q.question, correctAnswer: q.answer };
        }




        if (endpoint !== "") {
          // for backend request
          fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataToSend)
          })
          .then(function(response) {
            // display status
            console.log("Server status:", response.status);
          })
          .catch(function(error) {
            // catch error
            console.log("Server Status error", error);
          });
        }
      });
      // display message succes on generation
      alert("Succes in Quiz generation and sent to database");
    }); // End of submit function




    function renderQuiz(quiz) {
      questionsContainer.innerHTML = '';
      const header = document.createElement('div');
      header.innerHTML = `<strong>${escapeHtml(quiz.title)}</strong> — ${escapeHtml(quiz.topic || 'No topic provided')}`;
      questionsContainer.appendChild(header);
      quiz.questions.forEach((q) => {
        const row = document.createElement('div');
        row.style.padding = '6px 0';
        row.textContent = `${q.id}. ${q.question}`;
        questionsContainer.appendChild(row);
      });
    }




    downloadQuiz.addEventListener('click', () => {
      if (!lastQuiz) return alert('Generate a quiz first');
      const blob = new Blob([JSON.stringify(lastQuiz, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(lastQuiz.title || 'quiz')}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });




    shareQuiz.addEventListener('click', () => {
      if (!lastQuiz) return alert('Generate a quiz first');
      const data = btoa(unescape(encodeURIComponent(JSON.stringify(lastQuiz))));
      const link = location.origin + location.pathname + '#quiz=' + data;
      shareOutput.style.display = 'block';
      shareOutput.textContent = link;
    });




    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }




    window.addEventListener('load', () => {
      const hash = location.hash.substring(1);
      if (!hash || !hash.startsWith('quiz=')) return;
      try {
        const q = JSON.parse(decodeURIComponent(escape(atob(hash.slice(5)))));
        lastQuiz = q;
        renderQuiz(q);
      } catch (e) {
        console.warn('Invalid shared quiz data');
      }
    });
  </script>
</body>
</html>
